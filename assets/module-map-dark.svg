<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 612" width="1180" role="img" aria-labelledby="mm-title mm-desc">
<title id="mm-title">From a fitted Prony series to GLE dynamics</title>
<desc id="mm-desc">MemoryKernelFitting's modules produce a stage-2 Chebyshev fit file. The adapter in scripts/gle/prony_memory.jl reads it into a PronyMemory memory model and builds a Simulation of GLE_MDEF. Every integrator step, NQCDynamics calls the adapter's GLE_friction! at the half-step position, which rebuilds the coupling vector through qgle_coupling! and writes it into the drift matrix Gamma.</desc>
