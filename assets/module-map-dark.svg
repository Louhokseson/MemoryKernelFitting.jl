.lbl { font-size: 11px; fill: #97A0AF; }
.lane { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 12.5px; font-weight: 600; }
.lane-sub { font-size: 11px; fill: #97A0AF; }
.fit { fill: #E2A65A; } .bridge { fill: #B996EC; } .dyn { fill: #63B6D3; } .ink { fill: #E6E9EF; }
.box { fill: #161B22; stroke-width: 1.25; }
.s-fit { stroke: #E2A65A; } .s-bridge { stroke: #B996EC; } .s-dyn { stroke: #63B6D3; }
.s-data { stroke: #97A0AF; stroke-dasharray: 5 4; }
.edge { fill: none; stroke: #97A0AF; stroke-width: 1.25; }
.edge-hot { fill: none; stroke: #B996EC; stroke-width: 2; }
</style>
